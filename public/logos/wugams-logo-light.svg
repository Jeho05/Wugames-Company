    <path d="M454 600 C548 620 638 662 708 724" stroke="url(#goldSoft)" stroke-width="8" opacity=".95"/>
    <path d="M1146 600 C1052 620 962 662 892 724" stroke="url(#goldSoft)" stroke-width="8" opacity=".95"/>
  </g>
  <g text-anchor="middle">
